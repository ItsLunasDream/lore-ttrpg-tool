name: Build

on:
  push:
    branches: ['**']
  # Von Hand starten (Actions > Build > Run workflow). Mit „itch" laedt der
  # Lauf danach auf itch.io hoch, ohne dass es dafuer ein Release braucht,
  # etwa zum Testen gegen ein Projekt, das dort noch Entwurf ist.
  workflow_dispatch:
    inputs:
      itch:
        description: 'Danach auf itch.io hochladen'
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  test:
    name: Tests und Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Eine Fassung fuer alle Jobs, aus der .nvmrc der Wurzel. Der
          # Kartenmacher zieht PixiJS herein, und das greift beim Laden auf
          # globalThis.navigator zu — das gibt es erst ab Node 21. Unter
          # Node 20 brachen zehn seiner Testdateien mit
          # „ReferenceError: navigator is not defined" ab.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ui:
    name: Oberfläche und Markdown-Rundlauf
    needs: test
    runs-on: ubuntu-latest
    # Zeitgrenze: ein haengender Rauchtest soll scheitern, nicht sechs
    # Stunden laufen (so geschehen, als eine Hintergrund-Ansicht die
    # feste Fensterposition eines Tests belegte).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Fassung aus der .nvmrc der Wurzel, Begruendung im Job oben.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # xdotool fuer den Maustasten-Rauchtest: er schickt echte
      # X11-Tastenereignisse, weil ein nachgebautes Ereignis den Weg, um den
      # es geht, gerade ueberspringt. Fehlt es, meldet der Test sich ab.
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool
      # Beide Tests fahren die gebaute Anwendung hoch. Die Tests oben laufen
      # gegen einzelne Module und sehen weder die Oberflaeche noch das Schema
      # des Editors.
      - name: Rauchtest
        run: npm run smoke:backstory
      - name: Markdown-Rundlauf
        run: npm run roundtrip
      # Die Huelle startet ihren eigenen Hauptprozess. Ihre Modultests sehen
      # nur reine Funktionen, nicht das Fenster.
      - name: Rauchtest der Huelle
        run: npm run smoke
      # Nur das Web-Buendel. Der Tauri-Build braucht Systembibliotheken
      # (libgtk-3-dev, libwebkit2gtk-4.1-dev, ...), die hier fehlen; sein
      # Rust-Anteil bleibt vorerst ungeprueft in der CI. Der End-to-End-Lauf
      # unter e2e/ braucht einen installierten Browser und laeuft hier
      # ebenfalls noch nicht mit.
      - name: Kartenmacher-Bündel bauen
        run: npm run build -w apps/mapmaker

  package-check:
    name: Gepacktes Paket prüfen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Fassung aus der .nvmrc der Wurzel, Begruendung im Job oben.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run icon
      - name: Linux-Paket bauen
        run: npm run dist:backstory:linux:dir
      # Faengt fehlende Abhaengigkeiten im asar-Paket ab. Die Tests oben
      # laufen gegen die Quelle und koennen das nicht sehen.
      - name: Gepackte Anwendung starten
        run: xvfb-run -a npm run verify:package -w apps/backstory -- "$PWD/apps/backstory/release/linux-unpacked/backstory-creator"
      - name: Log bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-verify-log
          path: apps/backstory/package-verify.log
          if-no-files-found: ignore
          retention-days: 1

  suite-check:
    name: Gepacktes Paket der Sammlung prüfen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Fassung aus der .nvmrc der Wurzel, Begruendung im Job oben.
          node-version-file: .nvmrc
          cache: npm
      # Electron (gut 100 MB) und die Werkzeuge von electron-builder
      # zwischenspeichern. Sonst laedt jeder Lauf sie neu von GitHub, und ein
      # abgebrochener Download liess den Build scheitern (Lauf 360, main).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-linux-
      - run: npm ci
      # Bei einem Release traegt der Build die Fassung des Tags (v1.0.2 wird
      # 1.0.2): Ueber-Dialog, Dateiname des Installers und itch.io. Das
      # Skript liest das Tag selbst aus GITHUB_REF_NAME, damit kein Tagtext
      # in eine Shell-Zeile eingesetzt wird.
      - name: Fassung aus dem Release-Tag
        if: github.event_name == 'release'
        run: node scripts/version-aus-tag.mjs
      - name: Linux-Paket der Sammlung bauen
        run: npm run dist:suite:linux:dir
      # Der Rauchtest laeuft gegen die ungepackte Huelle und sieht nicht, ob
      # die Dateien der eingebetteten Anwendungen im Paket ankommen — dort
      # liegen sie an einem anderen Ort als im Workspace. Diese Pruefung
      # startet das Paket mit einem geoeffneten Werkzeug und wartet darauf,
      # dass es wirklich hochkommt.
      - name: Gepacktes Paket starten
        run: xvfb-run -a npm run verify:package:suite -- "$PWD/apps/shell/release/linux-unpacked/lore"
      # Bei einer Veroeffentlichung oder von Hand mit „itch", und nur wenn das
      # Projekt eingetragen ist (Variable ITCH_PROJEKT, z. B. name/lore). Ohne
      # die Variable bleibt der Schritt still aus; mit Variable, aber ohne
      # Secret BUTLER_API_KEY schlaegt er laut fehl.
      - name: Auf itch.io hochladen
        if: (github.event_name == 'release' || inputs.itch) && vars.ITCH_PROJEKT != ''
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_PROJEKT: ${{ vars.ITCH_PROJEKT }}
        run: bash scripts/itch-hochladen.sh linux apps/shell/release/linux-unpacked
      - name: Log bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-verify-log
          path: apps/shell/package-verify.log
          if-no-files-found: ignore
          retention-days: 1

  windows:
    name: Windows-Paket der Sammlung
    needs: [package-check, suite-check]
    # Nur dieser Job schreibt: er haengt die .exe an das Release. Ohne diese
    # Zeile hat das Token nur Leserecht, und der Schritt scheiterte mit
    # „Resource not accessible by integration" (v0.3.0, v0.4.0).
    permissions:
      contents: write
    # Windows-Laeufer zaehlen doppelt auf das Kontingent. Das fertige Paket
    # wird nur dort gebaut, wo es auch gebraucht wird: auf main, fuer eine
    # Veroeffentlichung und wenn jemand den Lauf von Hand startet. Auf Zweigen
    # genuegen die Tests darueber.
    #
    # Gebaut und veroeffentlicht wird die Sammlung, nicht mehr die einzelne
    # Anwendung. Die bleibt baubar (`npm run dist:backstory:win`) und
    # wird im Job „Gepacktes Paket pruefen" weiter geprueft — sie ist nur kein
    # Auslieferungsgegenstand mehr.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Fassung aus der .nvmrc der Wurzel, Begruendung im Job oben.
          node-version-file: .nvmrc
          cache: npm
      # Electron (gut 100 MB) und die Werkzeuge von electron-builder
      # zwischenspeichern. Sonst laedt jeder Lauf sie neu von GitHub, und ein
      # abgebrochener Download liess den Build scheitern (Lauf 360, main).
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-
      - run: npm ci
      # Bei einem Release traegt der Build die Fassung des Tags (v1.0.2 wird
      # 1.0.2): Ueber-Dialog, Dateiname des Installers und itch.io. Das
      # Skript liest das Tag selbst aus GITHUB_REF_NAME, damit kein Tagtext
      # in eine Shell-Zeile eingesetzt wird.
      - name: Fassung aus dem Release-Tag
        if: github.event_name == 'release'
        run: node scripts/version-aus-tag.mjs
      - run: npm run dist:suite:win
      - name: Gepacktes Paket starten
        run: npm run verify:package:suite -- "${{ github.workspace }}\apps\shell\release\win-unpacked\LORE.exe"
      # Fuer Windows geht der Installer auf itch.io: ein Download, Startmenue
      # und Deinstallation wie gewohnt.
      - name: Auf itch.io hochladen (Installer)
        if: (github.event_name == 'release' || inputs.itch) && vars.ITCH_PROJEKT != ''
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_PROJEKT: ${{ vars.ITCH_PROJEKT }}
        run: bash scripts/itch-hochladen.sh windows apps/shell/release/LORE-Setup-*.exe
      # Abgeschaltet: das ungepackte Paket als eigener Kanal. Lohnt sich, wenn
      # viele die itch-App nutzen: sie installiert selbst und laedt bei
      # Updates nur die Aenderungen. Zum Einschalten `false &&` entfernen.
      - name: Auf itch.io hochladen (ungepackt, abgeschaltet)
        if: false && (github.event_name == 'release' || inputs.itch) && vars.ITCH_PROJEKT != ''
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_PROJEKT: ${{ vars.ITCH_PROJEKT }}
        run: bash scripts/itch-hochladen.sh windows-zip apps/shell/release/win-unpacked
      - name: Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: lore-windows
          path: apps/shell/release/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: An Release anhängen
        if: github.event_name == 'release'
        # Auf den Commit festgenagelt, nicht auf den Tag: dieser Schritt ist
        # der einzige mit Schreibrecht, und ein Tag laesst sich umhaengen.
        # Die vier actions/* darueber kommen von GitHub selbst und bleiben am
        # Tag. Beim Aktualisieren: neue Fassung heraussuchen, SHA per
        # `git ls-remote --tags` holen, beides hier eintragen.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: apps/shell/release/*.exe
